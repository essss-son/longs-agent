# longs-agent 配置示例
# 复制为 config.toml 并填入你的供应商信息。api_key 用环境变量，不写在此文件。
# 支持 OpenAI 兼容供应商：DeepSeek / Qwen(DashScope) / Ollama / OpenAI / 本地 vLLM

# 默认供应商别名（/model 切换时引用别名）
[default]
alias = "default"
provider = "openai_compatible"
base_url = "https://api.deepseek.com"   # DeepSeek 示例
model = "deepseek-chat"
context_window = 64000
api_key_env = "DEEPSEEK_API_KEY"        # 从该环境变量读取 api_key

# 可选：再加一家，用 /model <alias> 热切换
# [qwen]
# alias = "qwen"
# provider = "openai_compatible"
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# model = "qwen-plus"
# context_window = 128000
# api_key_env = "DASHSCOPE_API_KEY"
