[project]
name = "longs-agent"
version = "0.1.0"
description = "A Claude Code-style async code agent CLI."
requires-python = ">=3.12"
dependencies = [
    "prompt_toolkit>=3.0",
    "openai>=1.30",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
agent = "agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
